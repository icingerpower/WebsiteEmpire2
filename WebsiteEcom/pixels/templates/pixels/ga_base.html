<script async src="https://www.googletagmanager.com/gtag/js?id={{ pixel_id|escapejs }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
{% if consent_mode %}
{# ADR-025 D3 item 4 (Google Consent Mode v2): this snippet only exists in
   the response at all when "analytics" is granted (server-side gating,
   pixels/slot_provider.py) -- analytics_storage is therefore always
   'granted' here. ad_storage/ad_user_data/ad_personalization truthfully
   reflect whether "marketing" is ALSO granted -- this is the honest,
   truthful default Google's EEA enforcement checks for when a merchant
   links GA4 to Google Ads. #}
gtag('consent', 'default', {
  'analytics_storage': '{% if consent_mode.analytics_granted %}granted{% else %}denied{% endif %}',
  'ad_storage': '{% if consent_mode.marketing_granted %}granted{% else %}denied{% endif %}',
  'ad_user_data': '{% if consent_mode.marketing_granted %}granted{% else %}denied{% endif %}',
  'ad_personalization': '{% if consent_mode.marketing_granted %}granted{% else %}denied{% endif %}'
});
{% endif %}
{% if page_url %}
{# PIX:P1 (human decision 2026-07-11): override the automatically-collected
   page_location so the automatic page_view never reports the real URL —
   used on the thank-you page to strip the never-expiring signed order
   token. page_location is GA4's documented config-time override for the
   automatically-collected page URL parameter. #}
gtag('config', '{{ pixel_id|escapejs }}', {'page_location': '{{ page_url|escapejs }}'});
{% else %}
gtag('config', '{{ pixel_id|escapejs }}');
{% endif %}
document.addEventListener('pradize:pixels', function (e) {
  var d = (e && e.detail) || {};
  if (d.event !== 'add_to_cart') { return; }
  var p = d.payload || {};
  gtag('event', 'add_to_cart', {
    currency: p.currency,
    value: p.value,
    items: (p.content_ids || []).map(function (id) {
      return {item_id: id, quantity: p.num_items || 1};
    })
  });
});
</script>
