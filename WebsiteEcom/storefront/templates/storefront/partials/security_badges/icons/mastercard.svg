note (ADR-030 Risk #1) shared by every payment-network icon in this folder.
{% endcomment %}
<svg class="security-badge__icon security-badge__icon--mastercard" width="38" height="24" viewBox="0 0 38 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mastercard">
  <rect width="38" height="24" rx="3" fill="#f7f7f7" stroke="#dddddd"/>
  <circle cx="16" cy="12" r="7" fill="#eb001b"/>
  <circle cx="24" cy="12" r="7" fill="#f79e1b" fill-opacity="0.9"/>
</svg>
