{% comment %}
Schematic Visa network mark. ADR-030 Risk #1: a one-time legal/brand check of
the shipped payment-network SVGs is PENDING before first release (does not
block writing this code). Only rendered when "card" is in accepted_families
(storefront/partials/security_badges/_payment_logos.html) — never a fixed,
config-independent list (ADR-030 §3).
{% endcomment %}
<svg class="security-badge__icon security-badge__icon--visa" width="38" height="24" viewBox="0 0 38 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Visa">
  <rect width="38" height="24" rx="3" fill="#1a1f71"/>
  <text x="19" y="16" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#ffffff">VISA</text>
</svg>
