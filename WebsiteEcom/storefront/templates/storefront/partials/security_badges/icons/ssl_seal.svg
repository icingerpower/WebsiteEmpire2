{% comment %}
Generic "SSL Secured" shield-check seal (ADR-030 §1.1/§3) — same
request.is_secure() gate as lock_shield.svg. Not a third-party certification
mark (no McAfee/Norton/TRUSTe branding) — see ADR-030 §1 D1 for why the
platform never ships a mark it cannot verify.
{% endcomment %}
<svg class="security-badge__icon security-badge__icon--ssl-seal" width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SSL secured">
  <path d="M15 2 L27 7 V15 c0 8 -5 12 -12 13 c-7 -1 -12 -5 -12 -13 V7 Z" fill="none" stroke="#088650" stroke-width="2.4"/>
  <path d="M9 15 l4 4 l8 -9" fill="none" stroke="#088650" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
