{% comment %}
Generic, self-descriptive "encrypted connection" glyph (ADR-030 §1.1/§3).
Rendered inline (never <img>) for zero-CLS/zero-network-request — only ever
included when request.is_secure() is True (badges/slot_provider.py), never
gated by admin configuration, so the claim is true by construction.
{% endcomment %}
<svg class="security-badge__icon security-badge__icon--lock" width="28" height="28" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Secure connection">
  <rect x="5" y="12" width="18" height="13" rx="2" fill="#333333"/>
  <path d="M9 12 V9 a5 5 0 0 1 10 0 v3" fill="none" stroke="#333333" stroke-width="2.4"/>
  <circle cx="14" cy="18" r="1.8" fill="#fafafa"/>
</svg>
