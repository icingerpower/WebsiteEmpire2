{% comment %}
Schematic PayPal mark. Only rendered when "paypal" is in accepted_families
(storefront/partials/security_badges/_payment_logos.html) — never a fixed,
config-independent list (ADR-030 §3). See visa.svg for the
pending-legal-check note (ADR-030 Risk #1).
{% endcomment %}
<svg class="security-badge__icon security-badge__icon--paypal" width="38" height="24" viewBox="0 0 38 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PayPal">
  <rect width="38" height="24" rx="3" fill="#003087"/>
  <text x="19" y="16" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff">PayPal</text>
</svg>
