<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block subject %}{% endblock %}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: #333333;
    }
    .wrapper {
      max-width: 600px;
      margin: 32px auto;
      background-color: #ffffff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .header {
      background-color: #1a1a2e;
      padding: 24px 32px;
      text-align: center;
    }
    .header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .content {
      padding: 32px;
    }
    .footer {
      background-color: #f9f9f9;
      border-top: 1px solid #eeeeee;
      padding: 20px 32px;
      text-align: center;
      font-size: 13px;
      color: #999999;
    }
    table.order-table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }
    table.order-table th {
      text-align: left;
      border-bottom: 2px solid #eeeeee;
      padding: 8px 4px;
      font-size: 13px;
      color: #666666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    table.order-table td {
      padding: 10px 4px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 15px;
    }
    table.order-table td.amount {
      text-align: right;
    }
    .totals {
      margin-top: 16px;
      text-align: right;
    }
    .totals .total-line {
      font-size: 15px;
      margin: 4px 0;
      color: #555555;
    }
    .totals .total-line.grand-total {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-top: 8px;
    }
    .address-block {
      background-color: #f9f9f9;
      border-radius: 6px;
      padding: 16px;
      margin: 16px 0;
      font-size: 15px;
      line-height: 1.6;
    }
    .tracking-box {
      background-color: #eef6ff;
      border-left: 4px solid #2563eb;
      border-radius: 4px;
      padding: 16px;
      margin: 16px 0;
    }
    .btn {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h1>{{ store.name }}</h1>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      &copy; {{ store.name }}. All rights reserved.
    </div>
  </div>
</body>
</html>
