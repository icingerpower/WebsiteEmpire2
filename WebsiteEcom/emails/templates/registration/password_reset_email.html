<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Password reset</title>
</head>
<body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#333;max-width:600px;margin:32px auto;padding:0 16px;">
  <h2>Reset your password</h2>
  <p>
    You requested a password reset for your account ({{ email }}).
    Click the link below to choose a new password. This link is valid for one use.
  </p>
  <p style="margin:24px 0;">
    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
       style="background-color:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-weight:600;font-size:15px;">
      Reset password
    </a>
  </p>
  <p style="color:#888;font-size:13px;">
    If you did not request a password reset, you can ignore this email. Your password will not change.
  </p>
</body>
</html>
