{% extends "admin/base_site.html" %}
{% block content %}
<h1>Add Language for {{ store.name }}</h1>
<form method="post">
  {% csrf_token %}
  <p>
    <label>Language code (e.g. fr, de, pt-br):
      <input type="text" name="lang_code" maxlength="10" required>
    </label>
  </p>
  <p>
    <label><input type="checkbox" name="use_path_prefix" value="true"> Use path prefix (/fr/) instead of subdomain</label>
  </p>
  <p>
    <label><input type="checkbox" name="is_default" value="true"> Set as default language</label>
  </p>
  <input type="submit" value="Add Language">
  <a href="..">Cancel</a>
</form>
{% endblock %}
